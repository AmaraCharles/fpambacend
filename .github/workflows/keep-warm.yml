# Render's free plan puts the API to sleep after ~15 minutes without traffic,
# so the first visitor waits ~30 s. This pings it every 10 minutes during
# working hours (06:00–20:00 WAT, Mon–Sat). GitHub may run scheduled jobs a
# few minutes late. Remove this file if you move to a paid Render plan.
name: Keep API warm
on:
  schedule:
    - cron: '*/10 5-19 * * 1-6'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 https://fpambacend.onrender.com/api/system/ping || curl -fsS --max-time 60 https://fpambacend.onrender.com/health
